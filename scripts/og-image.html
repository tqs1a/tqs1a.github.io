<!doctype html>
<!--
  Vorlage für assets/img/og-image.jpg (1200×630).
  Nach einer Namensänderung: Datei über den lokalen Server öffnen
  (http://localhost:8000/scripts/og-image.html), Fenster auf 1200×630 stellen
  bzw. in den DevTools "Capture node screenshot" auf #og anwenden und als JPG speichern.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>OG-Bild</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/scripts/og-image.css">
  <!-- Name kommt aus data/site.js, damit er nirgends fest steht -->
  <script type="module">
    import { site, copy } from '/data/site.js';
    document.getElementById('name').textContent = site.name;
    document.getElementById('claim-a').textContent = copy.hero.titleBefore;
    document.getElementById('claim-b').textContent = copy.hero.titleAccent;
    document.getElementById('sub').textContent = copy.hero.eyebrow.replace(/\s*\{ort\}/, '');
  </script>
</head>
<body>
  <div id="og">
    <div class="band"></div>
    <div class="content">
      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#635BFF"/><stop offset=".55" stop-color="#00D4FF"/><stop offset="1" stop-color="#FF6BB5"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="#0A2540"/><path d="M9 23V9l14 14V9" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="name"></span>
      </div>
      <p class="claim"><span id="claim-a"></span> <span class="grad" id="claim-b"></span></p>
      <p class="sub" id="sub"></p>
    </div>
  </div>
</body>
</html>
